.badge-amex{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-family:"DM Mono",monospace;font-weight:500;background:#E6F1FB;color:#185FA5}

.sub-picker{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px;padding:2px 0 6px 56px}
.sub2-picker{display:flex;flex-wrap:wrap;gap:4px;margin-top:0;padding:2px 0 6px 72px}

.split-input{width:80px;padding:4px 8px;border:1px solid var(--color-border-tertiary,#ddd);border-radius:6px;font-family:"DM Mono",monospace;font-size:12px;text-align:right}
@media(max-width:500px){.tx-row{flex-wrap:wrap}.sub-picker{padding-left:0}.sub2-picker{padding-left:0}.split-row{padding-left:0}.freq-picker{padding-left:0}.notes-row{padding-left:0}}

<div id="app"></div>
<script type="module">
import React,{useState,useCallback,useRef,useEffect} from"https://esm.sh/react@18.3.1";
import ReactDOM from"https://esm.sh/react-dom@18.3.1/client";
const h=React.createElement;

const DEFAULT_SUBS=["groceries","commuting","eating out","coffee","clothes","gifts","expenses","lunch at work","days out with children","holidays","days out","children","home"];
const SKIP=[/initial balance/i,/cashback awarded/i,/account fee/i,/faster payment/i,/payment received/i,/monthly credit card fee/i,/total cashback/i,/interest charged/i];

// ── Parsers ──
function csvLine(l){const r=[];let c="",q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){r.push(c.trim());c="";}else c+=ch;}r.push(c.trim());return r;}

function parseAmex(text){
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean),txs=[];
  for(let i=1;i<lines.length;i++){
    const p=csvLine(lines[i]);if(p.length<3)continue;
    const amt=parseFloat(p[2]);if(isNaN(amt))continue;
    const desc=p[1].replace(/\s{2,}/g,"  ").trim();
    if(SKIP.some(s=>s.test(desc)))continue;
    if(/payment received/i.test(desc))continue;
    const dm=p[0].match(/(\d{2})\/(\d{2})\/(\d{4})/);
    txs.push({id:crypto.randomUUID(),date:dm?`${dm[3]}-${dm[2]}-${dm[1]}`:p[0],description:desc,amount:amt,source:"amex",category:null,subcategory:null,confirmed:false,splitFrom:null,recurring:false,recurringFrequency:null,recurringCustom:null,notes:null,priority:null,subcategory2:null});
  }
  return txs;
}

function parseSantander(text){
  const doc=new DOMParser().parseFromString(text,"text/html"),txs=[];
  for(const row of doc.querySelectorAll("tr")){
    const cells=Array.from(row.querySelectorAll("td")).map(td=>td.textContent.trim()).filter(Boolean);
    if(cells.length<3)continue;
    const dateCell=cells.find(c=>/^\d{4}-\d{2}-\d{2}$/.test(c));if(!dateCell)continue;
    const moneyRe=/[\u00a3\ufffd£]\s*([\d,]+\.\d{2})/;
    const descCells=cells.filter(c=>c!==dateCell&&!moneyRe.test(c)&&!/^\*\*\s*\d+$/.test(c));
    const raw=descCells.sort((a,b)=>b.length-a.length)[0]||"";
    if(SKIP.some(s=>s.test(raw)))continue;
    if(/payment received|cashback awarded|faster payment/i.test(raw))continue;
    const isRefund=/refund/i.test(raw);
    let amt=0;const mc=cells.filter(c=>moneyRe.test(c));
    if(mc.length>0){const m=mc[mc.length-1].match(moneyRe);if(m)amt=parseFloat(m[1].replace(/,/g,""));}
    if(amt===0)continue;if(isRefund)amt=-amt;
    const parts=raw.split(/\s{3,}/).map(p=>p.trim()).filter(Boolean);
    let desc=raw.replace(/\s+/g," ").trim();
    if(parts.length>=3)desc=parts[2];else if(parts.length===2)desc=parts[1]||parts[0];
    txs.push({id:crypto.randomUUID(),date:dateCell,description:desc,amount:amt,source:"santander",category:null,subcategory:null,confirmed:false,splitFrom:null,recurring:false,recurringFrequency:null,recurringCustom:null,notes:null,priority:null,subcategory2:null});
  }
  return txs;
}

async function parseFile(file){
  const text=await file.text();
  if(file.name.endsWith(".csv")||text.trimStart().startsWith("Date,"))return{source:"amex",transactions:parseAmex(text)};
  if(file.name.endsWith(".xls")||text.trimStart().startsWith("<!DOCTYPE")||text.trimStart().startsWith("<html"))return{source:"santander",transactions:parseSantander(text)};
  throw new Error("Unrecognised file. Expected Amex CSV or Santander XLS.");
}

// ── Rules ──
function normMerchant(d){
  return d.replace(/\s+(GB|UK|NL|US|IE)\s*$/i,"").replace(/\s+(APL|RETAIL|GOODS)$/i,"")
    .replace(/\s+\d{4,}.*$/i,"").replace(/\s+(LONDON|BIRMINGHAM|STAFFORD|MANCHESTER|CANNOCK|STOKE-ON-TREN|DUBLIN|WOKING|SHIPLEY|ALTRINCHAM|SAN FRANCISCO|GORING-BY-SEA|WELWYN GARDEN C?|WEST MIDLANDS|BROCTON|HOLLYHILL|AMAZON\.CO\.UK|INTERNET)\s*$/i,"")
    .replace(/\*\S+/g,"").replace(/\s+/g," ").trim().toUpperCase();
}

function matchRule(desc,rules){
  const key=normMerchant(desc);
  if(rules[key])return rules[key];
  for(const[rk,rv]of Object.entries(rules)){if(key.length>3&&rk.length>3&&(key.includes(rk)||rk.includes(key)))return rv;}
  return null;
}

function applyPredictions(txs,rules){
  return txs.map(tx=>{
    const rule=matchRule(tx.description,rules);
    if(rule)return{...tx,category:rule.category,subcategory:rule.subcategory,confirmed:false,recurring:rule.recurring||false,recurringFrequency:rule.recurringFrequency||null,recurringCustom:rule.recurringCustom||null,priority:rule.priority||null,subcategory2:rule.subcategory2||null};
    return tx;
  });
}

// ── Icons ──
const UploadIcon=()=>h("svg",{width:40,height:40,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:1.5,strokeLinecap:"round",strokeLinejoin:"round"},h("path",{d:"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"}),h("polyline",{points:"17 8 12 3 7 8"}),h("line",{x1:12,y1:3,x2:12,y2:15}));
const CheckIcon=()=>h("svg",{width:14,height:14,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:2.5,strokeLinecap:"round",strokeLinejoin:"round"},h("polyline",{points:"20 6 9 17 4 12"}));
const DlIcon=()=>h("svg",{width:14,height:14,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"},h("path",{d:"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"}),h("polyline",{points:"7 10 12 15 17 10"}),h("line",{x1:12,y1:15,x2:12,y2:3}));

function fmtAmt(a){return a<0?"-£"+Math.abs(a).toFixed(2):"£"+a.toFixed(2);}
function fmtDate(d){if(!d||d.length<10)return d;const[,m,day]=d.split("-");const ms=["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return parseInt(day)+" "+ms[parseInt(m)];}

const RULES_FILE="spending-rules.json";

// ── App ──
function App(){
  const[view,setView]=useState("upload");
  const[txs,setTxs]=useState([]);
  const[rules,setRules]=useState({});
  const[subs,setSubs]=useState(DEFAULT_SUBS);
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState(null);
  const[appDirHandle,setAppDirHandle]=useState(null);
  const fileRef=useRef(null),addRef=useRef(null),importRef=useRef(null);

  useEffect(()=>{try{const s=localStorage.getItem("st-rules");if(s)setRules(JSON.parse(s));}catch{}},[]);
  useEffect(()=>{try{localStorage.setItem("st-rules",JSON.stringify(rules));}catch{}},[rules]);
  useEffect(()=>{try{const s=localStorage.getItem("st-subs");if(s)setSubs(JSON.parse(s));}catch{}},[]);
  useEffect(()=>{try{localStorage.setItem("st-subs",JSON.stringify(subs));}catch{}},[subs]);
  const[sub2Config,setSub2Config]=useState({});
  useEffect(()=>{try{const s=localStorage.getItem("st-sub2");if(s)setSub2Config(JSON.parse(s));}catch{}},[]);
  useEffect(()=>{try{localStorage.setItem("st-sub2",JSON.stringify(sub2Config));}catch{}},[sub2Config]);
  // Auto-save rules to folder when connected
  useEffect(()=>{
    if(!appDirHandle||!Object.keys(rules).length)return;
    const data={rules,subcategories:subs,sub2Config};
    (async()=>{try{const fh=await appDirHandle.getFileHandle(RULES_FILE,{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(data,null,2));await w.close();}catch{}})();
  },[rules,subs,sub2Config,appDirHandle]);

  const addSub=useCallback((name)=>{
    const clean=name.trim().toLowerCase();
    if(!clean||subs.includes(clean))return;
    setSubs(prev=>[...prev,clean]);
  },[subs]);

  const addSub2Option=useCallback((subcategory,option)=>{
    const clean=option.trim().toLowerCase();
    if(!clean)return;
    setSub2Config(prev=>{
      const existing=prev[subcategory]||[];
      if(existing.includes(clean))return prev;
      return{...prev,[subcategory]:[...existing,clean]};
    });
  },[]);

  const setSub2=useCallback((id,sub2)=>{
    setTxs(prev=>prev.map(tx=>{
      if(tx.id!==id)return tx;
      const k=normMerchant(tx.description);
      if(k&&!tx.splitFrom)setRules(r=>({...r,[k]:{...r[k],subcategory2:sub2||null}}));
      return{...tx,subcategory2:sub2||null};
    }));
  },[]);

  const handleFile=useCallback(async(file)=>{
    if(!file)return;setLoading(true);setError(null);
    try{
      const{source,transactions:parsed}=await parseFile(file);
      if(!parsed.length)throw new Error("No transactions found in "+file.name);
      const predicted=applyPredictions(parsed,rules);
      setTxs(prev=>{const other=prev.filter(t=>t.source!==source);return[...other,...predicted].sort((a,b)=>a.date.localeCompare(b.date));});
      setView("review");
    }catch(e){setError(e.message);}
    finally{setLoading(false);if(fileRef.current)fileRef.current.value="";if(addRef.current)addRef.current.value="";}
  },[rules]);

  const confirm=useCallback((id)=>{
    setTxs(prev=>prev.map(tx=>tx.id===id?{...tx,confirmed:true}:tx));
  },[]);

  const categorise=useCallback((id,cat)=>{
    setTxs(prev=>prev.map(tx=>{
      if(tx.id!==id)return tx;
      const k=normMerchant(tx.description);
      if(k&&!tx.splitFrom)setRules(r=>({...r,[k]:{...r[k],category:cat,subcategory:tx.subcategory}}));
      return{...tx,category:cat,confirmed:true};
    }));
  },[]);

  const setSub=useCallback((id,sub)=>{
    setTxs(prev=>prev.map(tx=>{
      if(tx.id!==id)return tx;
      const k=normMerchant(tx.description);
      if(k&&!tx.splitFrom)setRules(r=>({...r,[k]:{...r[k],category:tx.category,subcategory:sub}}));
      return{...tx,subcategory:sub};
    }));
  },[]);

  const splitTx=useCallback((id,amt1,cat1,cat2)=>{
    setTxs(prev=>{
      const tx=prev.find(t=>t.id===id);if(!tx)return prev;
      const amt2=parseFloat((tx.amount-amt1).toFixed(2));
      const tx1={...tx,id:crypto.randomUUID(),amount:amt1,category:cat1,subcategory:null,confirmed:true,splitFrom:tx.id,description:tx.description+" (split)"};
      const tx2={...tx,id:crypto.randomUUID(),amount:amt2,category:cat2,subcategory:null,confirmed:true,splitFrom:tx.id,description:tx.description+" (split)"};
      return prev.filter(t=>t.id!==id).concat([tx1,tx2]).sort((a,b)=>a.date.localeCompare(b.date));
    });
  },[]);

  const setNotes=useCallback((id,notes)=>{
    setTxs(prev=>prev.map(tx=>tx.id===id?{...tx,notes:notes||null}:tx));
  },[]);

  const setPriority=useCallback((id,priority)=>{
    setTxs(prev=>prev.map(tx=>{
      if(tx.id!==id)return tx;
      const k=normMerchant(tx.description);
      if(k&&!tx.splitFrom)setRules(r=>({...r,[k]:{...r[k],priority}}));
      return{...tx,priority};
    }));
  },[]);

  const reorganiseSub=useCallback((oldSub,newPrimary,newDetail)=>{
    const clean=newPrimary.trim().toLowerCase();
    if(!clean)return;
    // Update all rules with this subcategory
    setRules(r=>{
      const updated={...r};
      Object.keys(updated).forEach(k=>{
        if(updated[k].subcategory===oldSub)
          updated[k]={...updated[k],subcategory:clean,subcategory2:newDetail||null};
      });
      return updated;
    });
    // Ensure newPrimary exists in subs
    setSubs(prev=>prev.includes(clean)?prev:[...prev,clean]);
    // Add newDetail as a sub2 option under newPrimary
    if(newDetail){
      const d=newDetail.trim().toLowerCase();
      setSub2Config(prev=>({...prev,[clean]:[...new Set([...(prev[clean]||[]),d])]}));
    }
  },[]);

  const assignPriorityBySubcategory=useCallback((subcategory,priority)=>{
    setRules(r=>{
      const updated={...r};
      Object.keys(updated).forEach(k=>{if(updated[k].subcategory===subcategory)updated[k]={...updated[k],priority};});
      return updated;
    });
  },[]);

  const updateSub2Rule=useCallback((description,splitFrom,sub2)=>{
    const k=normMerchant(description);
    if(k&&!splitFrom)setRules(r=>({...r,[k]:{...r[k],subcategory2:sub2||null}}));
  },[]);

  const assignPriorityBySub2=useCallback((subcategory,sub2,priority)=>{
    setRules(r=>{
      const updated={...r};
      Object.keys(updated).forEach(k=>{if(updated[k].subcategory===subcategory&&updated[k].subcategory2===sub2)updated[k]={...updated[k],priority};});
      return updated;
    });
  },[]);

  const setRecurring=useCallback((id,recurring,frequency,custom)=>{
    setTxs(prev=>prev.map(tx=>{
      if(tx.id!==id)return tx;
      const k=normMerchant(tx.description);
      if(k&&!tx.splitFrom)setRules(r=>({...r,[k]:{...r[k],recurring,recurringFrequency:recurring?frequency:null,recurringCustom:recurring&&frequency==="custom"?custom:null}}));
      return{...tx,recurring,recurringFrequency:recurring?frequency:null,recurringCustom:recurring&&frequency==="custom"?custom:null};
    }));
  },[]);

  const confirmAll=useCallback(()=>{
    setTxs(prev=>prev.map(tx=>tx.category?{...tx,confirmed:true}:tx));
  },[]);

  const exportRules=async()=>{
    const data={rules,subcategories:subs,sub2Config};
    if(appDirHandle){
      try{const fh=await appDirHandle.getFileHandle(RULES_FILE,{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(data,null,2));await w.close();return;}catch{}
    }
    const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=RULES_FILE;a.click();URL.revokeObjectURL(u);
  };
  const importRulesFromData=(imp)=>{
    const newRules=imp.rules||imp;const m={...rules,...newRules};setRules(m);
    if(imp.subcategories){const merged=[...new Set([...subs,...imp.subcategories])];setSubs(merged);}
    if(imp.sub2Config){setSub2Config(prev=>({...prev,...imp.sub2Config}));}

function grpSub(txs){const m={};txs.forEach(t=>{const k=t.subcategory||"(none)";if(!m[k])m[k]={name:k,total:0,count:0};m[k].total+=t.amount;m[k].count++;});return Object.values(m).sort((a,b)=>b.total-a.total);}

// ── Trends ──
const ENRICH_FIELDS=["category","subcategory","subcategory2","recurring","recurringFrequency","recurringCustom","notes","priority"];
function dedup(txs){
  const seen=new Map();
  for(const t of txs){
    const key=`${t.date}|${t.description}|${t.amount}|${t.source}`;
    if(!seen.has(key)){seen.set(key,{...t});}
    else{
      // Merge: fill in any enrichment fields the existing record is missing
      const ex=seen.get(key);
      ENRICH_FIELDS.forEach(f=>{if((ex[f]==null||ex[f]===false)&&t[f]!=null&&t[f]!==false)ex[f]=t[f];});
    }
  }
  return [...seen.values()];
}

function normaliseDate(d){
  // YYYY-MM-DD → already fine
  if(/^\d{4}-\d{2}-\d{2}$/.test(d))return d;
  // DD/MM/YYYY
  const m=d.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(m)return`${m[3]}-${m[2]}-${m[1]}`;
  return d;
}

function parseTrendsCsv(text){
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  if(lines.length<2)return{txs:[],hasCats:false};
  const hdr=csvLine(lines[0]).map(h=>h.toLowerCase());
  const iDate=hdr.indexOf("date"),iDesc=hdr.indexOf("description"),iAmt=hdr.indexOf("amount"),iCat=hdr.indexOf("category"),iSub=hdr.indexOf("subcategory"),iSub2=hdr.indexOf("subcategory2"),iSrc=hdr.indexOf("source"),iRec=hdr.indexOf("recurring"),iRecF=hdr.indexOf("recurringfrequency"),iRecC=hdr.indexOf("recurringcustom"),iNotes=hdr.indexOf("notes"),iPri=hdr.indexOf("priority");
  if(iDate<0||iAmt<0)return{txs:[],hasCats:false};
  const txs=[];
  for(let i=1;i<lines.length;i++){
    const p=csvLine(lines[i]);if(p.length<Math.max(iDate,iAmt)+1)continue;
    const amt=parseFloat(p[iAmt]);if(isNaN(amt))continue;
    const cat=iCat>=0?p[iCat]||null:null;
    const rec=iRec>=0&&p[iRec]?.toLowerCase()==="yes";
    const recF=iRecF>=0?p[iRecF]||null:null;
    const recC=iRecC>=0?p[iRecC]||null:null;
    const pri=iPri>=0&&PRIORITIES.includes(p[iPri])?p[iPri]:null;
    txs.push({date:normaliseDate(p[iDate]),description:iDesc>=0?p[iDesc]:"",amount:amt,category:cat,subcategory:iSub>=0?p[iSub]||null:null,subcategory2:iSub2>=0?p[iSub2]||null:null,source:iSrc>=0?p[iSrc]:"unknown",recurring:rec,recurringFrequency:recF,recurringCustom:recC,notes:iNotes>=0?p[iNotes]||null:null,priority:pri});
  }
  const hasCats=txs.some(t=>t.category==="joint"||t.category==="personal");
  return{txs,hasCats};
}

function monthKey(d){return d.slice(0,7);}

function Chart({data,width,height}){
  const canvasRef=useRef(null);
  useEffect(()=>{
    const ctx=canvasRef.current?.getContext("2d");if(!ctx||!data.length)return;
    const dpr=window.devicePixelRatio||1;
    canvasRef.current.width=width*dpr;canvasRef.current.height=height*dpr;
    ctx.scale(dpr,dpr);ctx.clearRect(0,0,width,height);

    const pad={top:20,right:20,bottom:50,left:60};
    const cw=width-pad.left-pad.right,ch=height-pad.top-pad.bottom;
    const maxVal=Math.max(...data.map(d=>Math.max(d.joint,d.personal,d.total)));
    if(maxVal===0)return;

    const barGroupW=cw/data.length;
    const barW=Math.min(barGroupW*0.28,24);
    const gap=2;

    // Y axis gridlines
    ctx.strokeStyle="#eee";ctx.lineWidth=1;
    const ySteps=5;
    for(let i=0;i<=ySteps;i++){
      const y=pad.top+ch-(ch*i/ySteps);
      ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(pad.left+cw,y);ctx.stroke();
      ctx.fillStyle="#999";ctx.font="11px 'DM Mono',monospace";ctx.textAlign="right";
      ctx.fillText("£"+Math.round(maxVal*i/ySteps),pad.left-8,y+4);
    }

    data.forEach((d,i)=>{
      const x=pad.left+i*barGroupW+barGroupW/2;
      const hJ=d.joint/maxVal*ch,hP=d.personal/maxVal*ch;
      // Joint bar
      ctx.fillStyle="#85b7eb";
      ctx.fillRect(x-barW-gap/2,pad.top+ch-hJ,barW,hJ);
      // Personal bar
      ctx.fillStyle="#ef9f27";
      ctx.fillRect(x+gap/2,pad.top+ch-hP,barW,hP);
      // Label
      ctx.fillStyle="#999";ctx.font="11px 'DM Mono',monospace";ctx.textAlign="center";
      ctx.save();ctx.translate(x,pad.top+ch+14);ctx.rotate(-Math.PI/6);
      const[yr,mo]=d.month.split("-");const ms=["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      ctx.fillText(ms[parseInt(mo)]+" "+yr.slice(2),0,0);
      ctx.restore();
    });
  },[data,width,height]);
  return h("canvas",{ref:canvasRef,style:{width,height,display:"block",margin:"0 auto"}});
}

const MASTER_FILE="spending-master.json";
const LS_KEY="st-trends";

function saveTrendsLS(txs){try{localStorage.setItem(LS_KEY,JSON.stringify(txs));}catch{}}
function loadTrendsLS(){try{const s=localStorage.getItem(LS_KEY);return s?JSON.parse(s):[];}catch{return[];}}

async function writeMasterToDir(dirHandle,txs){
  const fh=await dirHandle.getFileHandle(MASTER_FILE,{create:true});
  const w=await fh.createWritable();
  await w.write(JSON.stringify(txs,null,2));
  await w.close();
}

async function readMasterFromDir(dirHandle){
  try{
    const fh=await dirHandle.getFileHandle(MASTER_FILE);
    const file=await fh.getFile();
    const text=await file.text();
    return JSON.parse(text);
  }catch{return[];}
}

async function readCsvsFromDir(dirHandle){
  const txs=[];const names=[];
  for await(const entry of dirHandle.values()){
    if(entry.kind==="file"&&entry.name.endsWith(".csv")&&entry.name!==MASTER_FILE){
      const file=await entry.getFile();
      const text=await file.text();
      const{txs:parsed,hasCats}=parseTrendsCsv(text);
      if(parsed.length){txs.push(...parsed);names.push({name:entry.name,count:parsed.length,hasCats});}
    }
  }
  return{txs,names};
}

      h("div",{style:{display:"flex",gap:4}},

      ),
      h("button",{className:"pill",style:{fontSize:11,padding:"3px 10px"},onClick:()=>setOpen(o=>!o)},open?"Hide ▲":"Edit ▼")
    ),
    open&&h("div",{style:{marginTop:12,display:"flex",flexDirection:"column",gap:2}},

          )
        )
      )
    )
  );
}


function Trends({onBack,appDirHandle,setAppDirHandle,onDirConnected,onSubPriorityAssign,onSub2PriorityAssign,onSub2Rule,sub2Config,onAddSub2Option,onAddSub,onReorganiseSub}){
  const[allTxs,setAllTxs]=useState([]);
  const[files,setFiles]=useState([]);
  const[loading,setLoading]=useState(false);
  const[status,setStatus]=useState(null);
  const fileRef=useRef(null);
  const dirHandle=appDirHandle;
  const dirName=appDirHandle?.name;

  // Restore from localStorage on mount
  useEffect(()=>{
    const cached=loadTrendsLS();
    if(cached.length){setAllTxs(cached);setStatus("Restored "+cached.length+" transactions from cache");}
  },[]);

  // Save to localStorage (and master file if connected) whenever data changes
  useEffect(()=>{
    if(allTxs.length)saveTrendsLS(allTxs);
    if(allTxs.length&&appDirHandle){writeMasterToDir(appDirHandle,allTxs).catch(()=>{});}
  },[allTxs,appDirHandle]);

  const openFolder=useCallback(async()=>{
    try{
      const dh=await window.showDirectoryPicker({mode:"readwrite"});
      setAppDirHandle(dh);setLoading(true);setStatus("Reading folder...");
      // Auto-load rules from folder
      if(onDirConnected)await onDirConnected(dh);
      // Load master first, then CSVs, merge and dedup
      const master=await readMasterFromDir(dh);
      const{txs:csvTxs,names}=await readCsvsFromDir(dh);
      const merged=dedup([...allTxs,...master,...csvTxs]);
      setAllTxs(merged);
      setFiles(names);
      // Auto-save updated master back
      await writeMasterToDir(dh,merged);
      const uncatFiles=names.filter(n=>!n.hasCats).map(n=>n.name);
      const warn=uncatFiles.length?" ⚠ "+uncatFiles.join(", ")+" has no categories — use the exported spending CSV, not the raw bank statement.":"";
      setStatus("Loaded "+merged.length+" transactions from "+dh.name+" ("+names.length+" CSVs). Master file saved."+warn);
      setLoading(false);
    }catch(e){
      if(e.name!=="AbortError")setStatus("Error: "+e.message);
      setLoading(false);
    }
  },[setAppDirHandle,onDirConnected,allTxs]);

  const resync=useCallback(async()=>{
    if(!appDirHandle)return;
    setLoading(true);setStatus("Syncing...");
    const master=await readMasterFromDir(appDirHandle);
    const{txs:csvTxs,names}=await readCsvsFromDir(appDirHandle);
    const merged=dedup([...allTxs,...master,...csvTxs]);
    setAllTxs(merged);
    setFiles(names);
    await writeMasterToDir(appDirHandle,merged);
    const uncatFiles=names.filter(n=>!n.hasCats).map(n=>n.name);
    const warn=uncatFiles.length?" ⚠ "+uncatFiles.join(", ")+" has no categories — use the exported spending CSV, not the raw bank statement.":"";
    setStatus("Synced: "+merged.length+" transactions. Master file updated."+warn);
    setLoading(false);
  },[appDirHandle,allTxs]);

  // Fallback: manual file picker for browsers without directory API
  const handleFiles=useCallback(async(fileList)=>{
    const newTxs=[...allTxs];const newFiles=[...files];
    for(const f of fileList){
      if(!f.name.endsWith(".csv"))continue;
      const text=await f.text();
      const{txs:parsed,hasCats}=parseTrendsCsv(text);
      newTxs.push(...parsed);
      newFiles.push({name:f.name,count:parsed.length,hasCats});
    }
    const deduped=dedup(newTxs);
    setAllTxs(deduped);
    setFiles(newFiles);
    const uncatFiles=newFiles.filter(n=>!n.hasCats).map(n=>n.name);
    if(uncatFiles.length)setStatus("⚠ "+uncatFiles.join(", ")+" has no categories — use the exported spending CSV, not the raw bank statement.");
  },[allTxs,files]);

  // ── Filter state ──
  const allMonths=React.useMemo(()=>[...new Set(allTxs.map(t=>monthKey(t.date)))].sort(),[allTxs]);
  const allDates=React.useMemo(()=>{const ds=allTxs.map(t=>t.date).filter(Boolean).sort();return{min:ds[0]||"",max:ds[ds.length-1]||""};  },[allTxs]);
  const allSubs=React.useMemo(()=>[...new Set(allTxs.map(t=>t.subcategory).filter(Boolean))].sort(),[allTxs]);
  const allSources=React.useMemo(()=>[...new Set(allTxs.map(t=>t.source).filter(Boolean))].sort(),[allTxs]);
  const[dateFrom,setDateFrom]=useState("");
  const[dateTo,setDateTo]=useState("");
  const[catFilter,setCatFilter]=useState("all"); // "all"|"joint"|"personal"
  const[subFilter,setSubFilter]=useState([]); // [] = all
  const[sub2Filter,setSub2Filter]=useState([]); // [] = all
  const[sourceFilter,setSourceFilter]=useState([]); // [] = all
  const[searchQuery,setSearchQuery]=useState("");
  const[recurringFilter,setRecurringFilter]=useState("all");
  const allRecurringFreqs=React.useMemo(()=>[...new Set(allTxs.filter(t=>t.recurring&&t.recurringFrequency).map(t=>t.recurringFrequency))].sort(),[allTxs]);
  const hasAnyRecurring=React.useMemo(()=>allTxs.some(t=>t.recurring),[allTxs]);
  const[priorityFilter,setPriorityFilter]=useState("all");
  const hasAnyPriority=React.useMemo(()=>allTxs.some(t=>t.priority),[allTxs]);

  // Detail options available for currently selected primary subcategories
  const availableSub2Opts=React.useMemo(()=>{
    if(!subFilter.length)return[];
    const opts=new Set();
    subFilter.forEach(s=>(sub2Config[s]||[]).forEach(o=>opts.add(o)));
    return[...opts].sort();
  },[subFilter,sub2Config]);

  // Drop sub2Filter entries that no longer belong to the active subFilter
  useEffect(()=>{
    setSub2Filter(prev=>prev.filter(d=>subFilter.some(s=>(sub2Config[s]||[]).includes(d))));
  },[subFilter,sub2Config]);

  // Reset date bounds when data first loads
  useEffect(()=>{
    if(allDates.min){
      setDateFrom(prev=>prev||allDates.min);
      setDateTo(prev=>prev||allDates.max);
    }
  },[allDates]);

  const toggleSub=useCallback((s)=>{
    setSubFilter(prev=>prev.includes(s)?prev.filter(x=>x!==s):[...prev,s]);
  },[]);

  const filteredTxs=React.useMemo(()=>{
    return allTxs.filter(t=>{
      if(dateFrom&&t.date<dateFrom)return false;
      if(dateTo&&t.date>dateTo)return false;
      if(catFilter!=="all"&&t.category!==catFilter)return false;
      if(subFilter.length&&!subFilter.includes(t.subcategory))return false;
      if(sub2Filter.length&&!sub2Filter.includes(t.subcategory2))return false;
      if(sourceFilter.length&&!sourceFilter.includes(t.source))return false;
      if(searchQuery&&!t.description.toLowerCase().includes(searchQuery.toLowerCase()))return false;
      if(recurringFilter==="recurring"&&!t.recurring)return false;
      if(recurringFilter==="one-off"&&t.recurring)return false;
      if(recurringFilter!=="all"&&recurringFilter!=="recurring"&&recurringFilter!=="one-off"&&t.recurringFrequency!==recurringFilter)return false;
      if(priorityFilter==="unassigned"&&t.priority)return false;
      if(priorityFilter!=="all"&&priorityFilter!=="unassigned"&&t.priority!==priorityFilter)return false;
      return true;
    });
  },[allTxs,dateFrom,dateTo,catFilter,subFilter,sub2Filter,sourceFilter,recurringFilter,priorityFilter,searchQuery]);

  const monthly=React.useMemo(()=>{
    const m={};
    filteredTxs.forEach(t=>{
      const k=monthKey(t.date);
      if(!m[k])m[k]={month:k,joint:0,personal:0,total:0,count:0};
      if(t.category==="joint")m[k].joint+=t.amount;
      else if(t.category==="personal")m[k].personal+=t.amount;
      m[k].total+=t.amount;m[k].count++;
    });
    return Object.values(m).sort((a,b)=>a.month.localeCompare(b.month));
  },[filteredTxs]);

  const totals=React.useMemo(()=>{
    const j=filteredTxs.filter(t=>t.category==="joint").reduce((s,t)=>s+t.amount,0);
    const p=filteredTxs.filter(t=>t.category==="personal").reduce((s,t)=>s+t.amount,0);
    return{joint:j,personal:p,total:j+p};
  },[filteredTxs]);

  const subBreakJ=React.useMemo(()=>grpSub(filteredTxs.filter(t=>t.category==="joint")),[filteredTxs]);
  const subBreakP=React.useMemo(()=>grpSub(filteredTxs.filter(t=>t.category==="personal")),[filteredTxs]);

  const setTrendsCat=useCallback((txKey,category)=>{
    setAllTxs(prev=>prev.map(tx=>{
      const key=tx.id||tx.date+tx.description+tx.amount;
      return key===txKey?{...tx,category}:tx;
    }));
  },[]);

  const setTrendsSub=useCallback((txKey,subcategory)=>{
    setAllTxs(prev=>prev.map(tx=>{
      const key=tx.id||tx.date+tx.description+tx.amount;
      return key===txKey?{...tx,subcategory}:tx;
    }));
  },[]);

  const setTrendsSub2=useCallback((txKey,sub2)=>{
    setAllTxs(prev=>prev.map(tx=>{
      const key=tx.id||tx.date+tx.description+tx.amount;
      if(key!==txKey)return tx;
      if(onSub2Rule)onSub2Rule(tx.description,tx.splitFrom,sub2);
      return{...tx,subcategory2:sub2||null};
    }));
  },[onSub2Rule]);

  const setTrendsPriority=useCallback((txKey,priority)=>{
    setAllTxs(prev=>prev.map(tx=>{
      const key=tx.id||tx.date+tx.description+tx.amount;
      if(key!==txKey)return tx;
      return{...tx,priority};
    }));
  },[]);

  const bulkReorganiseSub=useCallback((oldSub,newPrimary,newDetail)=>{
    const clean=newPrimary.trim().toLowerCase();
    if(!clean)return;
    const detail=newDetail?newDetail.trim().toLowerCase():null;
    setAllTxs(prev=>prev.map(tx=>
      tx.subcategory===oldSub?{...tx,subcategory:clean,subcategory2:detail||tx.subcategory2}:tx
    ));
    if(onReorganiseSub)onReorganiseSub(oldSub,clean,detail);
  },[onReorganiseSub]);

  const bulkAssignPriority=useCallback((subcategory,priority)=>{
    setAllTxs(prev=>prev.map(tx=>tx.subcategory===subcategory?{...tx,priority}:tx));
    if(onSubPriorityAssign)onSubPriorityAssign(subcategory,priority);
  },[onSubPriorityAssign]);

  const bulkAssignPriority2=useCallback((subcategory,sub2,priority)=>{
    setAllTxs(prev=>prev.map(tx=>tx.subcategory===subcategory&&tx.subcategory2===sub2?{...tx,priority}:tx));
    if(onSub2PriorityAssign)onSub2PriorityAssign(subcategory,sub2,priority);
  },[onSub2PriorityAssign]);

  // For each subcategory (and sub2): dominant priority and count
  const subPriorityMap=React.useMemo(()=>{
    const m={};
    allTxs.forEach(t=>{
      if(!t.subcategory)return;

          editingNotesId===txKey&&onNotes&&h("div",{className:"notes-row",style:{paddingLeft:0,paddingTop:4}},
            h("textarea",{className:"notes-input",rows:2,maxLength:200,value:draftNote,placeholder:"Add a note…",autoFocus:true,onChange:e=>setDraftNote(e.target.value),onBlur:()=>{onNotes(txKey,draftNote);setEditingNotesId(null);}}),
            h("button",{className:"freq-btn active",style:{fontWeight:600,alignSelf:"flex-start"},onClick:()=>{onNotes(txKey,draftNote);setEditingNotesId(null);}},"✓")
          ),
          isEditing&&!tx.recurring&&onRecurring&&h("div",{className:"freq-picker"},
            ["weekly","monthly","yearly","custom"].map(f=>h("button",{key:f,className:"freq-btn"+(editFreq===f?" active":""),onClick:()=>setEditFreq(f)},f)),
            editFreq==="custom"&&h("input",{style:{width:100,padding:"3px 8px",borderRadius:12,border:"1px solid var(--color-border-secondary,#aaa)",fontSize:11,fontFamily:'"DM Mono",monospace'},value:editCustom,onChange:e=>setEditCustom(e.target.value),placeholder:"e.g. quarterly"}),
            h("button",{className:"freq-btn active",style:{fontWeight:600},onClick:()=>{
              onRecurring(txKey,true,editFreq,editFreq==="custom"?editCustom:null);
              setEditingId(null);
            }},"✓ Set")
          )
        );
      })
    )
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(h(App));
</script>
